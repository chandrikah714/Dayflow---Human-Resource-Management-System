kind = "web"
previewPath = "/"
title = "Dayflow HRMS"
description = "A focused human resources workspace for secure employee sign-in and self-service profile management."
version = "1.0.0"
id = "artifacts/dayflow"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 24048

[services.development]
run = "pnpm --filter @workspace/dayflow run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/dayflow", "run", "build" ]
serve = "static"
publicDir = "artifacts/dayflow/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "24048"
BASE_PATH = "/"
