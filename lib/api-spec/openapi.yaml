openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: auth
    description: Authentication operations
  - name: employee
    description: Employee profile operations
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /auth/register:
    post:
      operationId: register
      tags: [auth]
      summary: Register an employee account
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterInput"
      responses:
        "201":
          description: Account created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "409":
          description: Duplicate employee ID or email
  /auth/login:
    post:
      operationId: login
      tags: [auth]
      summary: Log in to Dayflow
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginInput"
      responses:
        "200":
          description: Authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "401":
          description: Invalid credentials
  /employee/profile:
    get:
      operationId: getProfile
      tags: [employee]
      summary: Get the current employee profile
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Employee profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserProfile"
        "401":
          description: Authentication required
    put:
      operationId: updateProfile
      tags: [employee]
      summary: Update editable employee profile fields
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProfileUpdate"
      responses:
        "200":
          description: Updated employee profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserProfile"
        "401":
          description: Authentication required
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    RegisterInput:
      type: object
      required: [employeeId, name, email, password, role]
      properties:
        employeeId: { type: string, minLength: 1 }
        name: { type: string, minLength: 1 }
        email: { type: string }
        password: { type: string, minLength: 8 }
        role: { type: string, enum: [EMPLOYEE, HR] }
    LoginInput:
      type: object
      required: [email, password]
      properties:
        email: { type: string }
        password: { type: string, minLength: 1 }
    AuthResponse:
      type: object
      required: [token, user]
      properties:
        token: { type: string }
        user:
          $ref: "#/components/schemas/UserProfile"
    UserProfile:
      type: object
      required: [id, employeeId, name, email, role, phone, address, profilePicture, createdAt]
      properties:
        id: { type: number }
        employeeId: { type: string }
        name: { type: string }
        email: { type: string }
        role: { type: string, enum: [EMPLOYEE, HR] }
        phone: { type: ["string", "null"] }
        address: { type: ["string", "null"] }
        profilePicture: { type: ["string", "null"] }
        createdAt: { type: string }
    ProfileUpdate:
      type: object
      properties:
        phone: { type: ["string", "null"] }
        address: { type: ["string", "null"] }
        profilePicture: { type: ["string", "null"] }

