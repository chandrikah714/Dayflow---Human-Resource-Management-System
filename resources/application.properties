spring.application.name=dayflow-hrms

# --- MySQL ---
spring.datasource.url=${DB_URL:jdbc:mysql://127.0.0.1:3306/dayflow_hrms?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true&createDatabaseIfNotExist=true}
spring.datasource.username=${DB_USERNAME:dayflow_app}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.open-in-view=false

server.port=${SERVER_PORT:8081}

# --- JWT ---
# 32+ byte secret required for HS256. Replace this before any real deployment.
app.jwt.secret=${JWT_SECRET:change-this-development-secret-before-production-32-bytes}
app.jwt.expiration-ms=86400000

# Signup requires email verification per the spec, but no SMTP server is
# configured in this project. Keep this false to log straight in after
# registering; flip to true + wire spring.mail.* to enforce it for real.
app.email-verification.enabled=false

app.cors.allowed-origin=${CORS_ALLOWED_ORIGIN:http://localhost:5173}
app.demo-data=${DEMO_DATA:false}
